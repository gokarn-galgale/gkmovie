name: Update Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python scraper.py

      - name: Commit & push (self-healing)
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add all_movies.m3u missing_movies_report.tsv
          if git diff --staged --quiet; then
            echo "No changes found in playlist or missing report."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add all_movies.m3u missing_movies_report.tsv
            if git diff --staged --quiet; then
              echo "No changes after syncing with origin/main."
              exit 0
            fi
            git commit -m "Auto-update playlist & missing report [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying..."
            sleep $(( attempt * 2 ))
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
