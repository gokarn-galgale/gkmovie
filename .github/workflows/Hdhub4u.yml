name: HDHub4u Scraper CI & Run

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Movie or Show title to test search'
        required: true
        default: 'Avengers'
  schedule:
    # Optional: runs automatically every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Test Search Query
        run: |
          python hdhub4u_scraper.py --search "${{ github.event.inputs.query || 'Avengers' }}" > output.json
          cat output.json

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: output.json
