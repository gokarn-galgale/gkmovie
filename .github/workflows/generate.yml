name: Generate M3U Playlist

on:
  schedule:
    # Runs automatically once every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevents hanging indefinitely on network/scraping stalls

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Playlist Generator
        env:
          PYTHONUNBUFFERED: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python generate_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes found in playlist."
          else
            git commit -m "Auto-update playlist.m3u with posters [skip ci]"
            git push origin HEAD:main
          fi
