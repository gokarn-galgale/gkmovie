name: Generate M3U Playlist (Cloud)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Crawler
        env:
          # Optional: Add a free/paid regional proxy URL if the ISP blocks cloud IPs
          # e.g., http://user:pass@proxy-ip:port
          HTTP_PROXY: ${{ secrets.REGIONAL_PROXY }}
          HTTPS_PROXY: ${{ secrets.REGIONAL_PROXY }}
        run: |
          python generate_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes found in playlist."
          else
            git commit -m "Auto-update playlist.m3u [skip ci]"
            git push origin HEAD:main
          fi
